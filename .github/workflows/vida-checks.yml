name: VIDA checks

on:
  push:
    branches: [main, 'stability/**']
  workflow_dispatch:

concurrency:
  group: vida-checks-main
  cancel-in-progress: true

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import project
        run: godot --headless --path . --import
      - name: Expanded city + mobile smoke
        run: timeout 75s godot --headless --path . -s tests/iteration_smoke_test.gd
      - name: Android + desktop adaptation
        run: timeout 120s godot --headless --path . -s tests/android_city_test.gd
      - name: Interactions
        run: timeout 75s godot --headless --path . -s tests/interactions_test.gd
      - name: Movement
        run: timeout 75s godot --headless --path . -s tests/movement_test.gd
      - name: Traffic
        run: timeout 75s godot --headless --path . -s tests/traffic_test.gd
      - name: Orientation
        run: timeout 90s godot --headless --path . -s tests/orientation_test.gd
