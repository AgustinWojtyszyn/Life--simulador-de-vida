name: VIDA checks

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import project
        run: godot --headless --path . --editor --quit-after 2
      - name: Phase 1 smoke
        run: godot --headless --path . -s tests/phase1_test.gd
      - name: Regional streets
        run: godot --headless --path . -s tests/regional_streets_test.gd
      - name: Orientation
        run: godot --headless --path . -s tests/orientation_test.gd
      - name: Interactions
        run: godot --headless --path . -s tests/interactions_test.gd
