name: VIDA checks

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vida-checks-main
  cancel-in-progress: true

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import project
        run: godot --headless --path . --editor --quit-after 2
      - name: Expanded city + mobile smoke
        run: godot --headless --path . -s tests/iteration_smoke_test.gd
      - name: Interactions
        run: godot --headless --path . -s tests/interactions_test.gd
      - name: Movement
        run: godot --headless --path . -s tests/movement_test.gd
