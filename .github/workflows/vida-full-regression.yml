name: VIDA full regression

on:
  workflow_dispatch:

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - run: godot --headless --path . --editor --quit-after 2
      - run: godot --headless --path . -s tests/phase1_test.gd
      - run: godot --headless --path . -s tests/regional_streets_test.gd
      - run: godot --headless --path . -s tests/orientation_test.gd
      - run: godot --headless --path . -s tests/interactions_test.gd
      - run: godot --headless --path . -s tests/traffic_test.gd
