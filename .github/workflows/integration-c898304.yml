name: VIDA integration c898304

on:
  push:
    branches:
      - integration/c898304-merged-2026-09-27

concurrency:
  group: vida-integration-c898304
  cancel-in-progress: true

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import project
        run: godot --headless --path . --import
      - name: Iteration smoke
        run: timeout 90s godot --headless --path . -s tests/iteration_smoke_test.gd
      - name: Android and desktop adaptation
        run: timeout 120s godot --headless --path . -s tests/android_city_test.gd
      - name: Playground
        run: timeout 90s godot --headless --path . -s tests/playground_test.gd
      - name: Regional streets
        run: timeout 120s godot --headless --path . -s tests/regional_streets_test.gd
      - name: Orientation
        run: timeout 120s godot --headless --path . -s tests/orientation_test.gd
      - name: Interactions
        run: timeout 90s godot --headless --path . -s tests/interactions_test.gd
      - name: Traffic
        run: timeout 120s godot --headless --path . -s tests/traffic_test.gd
      - name: Movement
        run: timeout 90s godot --headless --path . -s tests/movement_test.gd
